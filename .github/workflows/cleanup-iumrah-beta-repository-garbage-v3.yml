name: Cleanup iumrah Beta repository garbage

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove all Beta update garbage from repository root
        shell: bash
        run: |
          set -euo pipefail

          echo "Tracked root files before cleanup:"
          git ls-files | awk 'index($0, "/") == 0 {print "  " $0}'

          removed=0

          while IFS= read -r -d '' file; do
            # Root files only. Never touch anything inside a directory.
            if [[ "$file" == */* ]]; then
              continue
            fi

            case "$file" in
              iumrah-beta-update-*|BETA_*)
                echo "Removing tracked garbage: $file"
                git rm -f -- "$file"
                removed=$((removed + 1))
                ;;
            esac
          done < <(git ls-files -z)

          # Also remove matching untracked root files, if any.
          find . -maxdepth 1 -type f -name 'iumrah-beta-update-*' -print -delete
          find . -maxdepth 1 -type f -name 'BETA_*' -print -delete

          echo "Removed tracked files: $removed"

          echo "Matching root files remaining after cleanup:"
          remaining=0
          while IFS= read -r -d '' file; do
            if [[ "$file" == */* ]]; then
              continue
            fi
            case "$file" in
              iumrah-beta-update-*|BETA_*)
                echo "  STILL PRESENT: $file"
                remaining=$((remaining + 1))
                ;;
            esac
          done < <(git ls-files -z)

          if (( remaining > 0 )); then
            echo "ERROR: $remaining matching tracked file(s) still remain."
            exit 1
          fi

          echo "Repository root cleanup verified."

      - name: Commit and push cleanup
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "iumrah-ci"
          git config user.email "actions@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No matching files existed, so there is nothing to commit."
            exit 0
          fi

          echo "Changes to commit:"
          git diff --cached --name-status

          git commit -m "Remove Beta update garbage [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
