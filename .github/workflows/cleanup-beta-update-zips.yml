name: Cleanup iumrah Beta update ZIPs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove old iumrah Beta update ZIPs
        run: |
          set -euo pipefail

          echo "Searching for old iumrah Beta update ZIP files in repository root..."

          mapfile -t zip_files < <(find . -maxdepth 1 -type f -name 'iumrah-beta-update-*.zip' -print)

          if [ "${#zip_files[@]}" -eq 0 ]; then
            echo "No old iumrah Beta update ZIP files found."
            exit 0
          fi

          printf 'Removing:\n'
          printf '  %s\n' "${zip_files[@]}"

          rm -f -- "${zip_files[@]}"

          echo "Old iumrah Beta update ZIP files removed from working tree."

      - name: Commit cleanup
        run: |
          set -euo pipefail

          git config user.name "iumrah-ci"
          git config user.email "actions@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "Cleanup old iumrah Beta update ZIPs [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
