name: Apply iumrah Beta ZIP update

on:
  push:
    branches: [main]
    paths:
      - 'iumrah-beta-update-*.zip'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract update safely
        shell: python
        run: |
          import pathlib
          import shutil
          import sys
          import zipfile

          root = pathlib.Path('.').resolve()
          archives = sorted(root.glob('iumrah-beta-update-*.zip'))

          if not archives:
              print('No iumrah Beta update ZIP found.')
              sys.exit(0)

          protected_prefixes = (
              '.git/',
              '.github/workflows/',
              'Signing/',
          )

          for archive in archives:
              print(f'Applying {archive.name}')
              with zipfile.ZipFile(archive) as z:
                  for member in z.infolist():
                      name = member.filename.replace('\\', '/')
                      target = (root / name).resolve()

                      if root not in target.parents and target != root:
                          raise RuntimeError(f'Unsafe ZIP path: {member.filename}')

                      if any(name.startswith(prefix) for prefix in protected_prefixes):
                          print(f'Skipping protected path: {name}')
                          continue

                      if member.is_dir():
                          target.mkdir(parents=True, exist_ok=True)
                          continue

                      target.parent.mkdir(parents=True, exist_ok=True)
                      with z.open(member) as source, open(target, 'wb') as destination:
                          shutil.copyfileobj(source, destination)

              archive.unlink()

      - name: Validate repository after patch
        run: |
          set -euo pipefail
          test -f project.yml
          test -d Sources
          test -d Resources/Assets.xcassets
          test -f Sources/App/IumrahBetaApp.swift
          test -f Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
          echo 'iumrah Beta patch structure validated.'

      - name: Commit applied files
        run: |
          set -euo pipefail
          git config user.name "iumrah-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Apply iumrah Beta update [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
