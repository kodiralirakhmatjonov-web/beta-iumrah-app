name: 00 Initialize Foundation

"on": workflow_dispatch

permissions:
  contents: write

concurrency:
  group: kepler-initialize
  cancel-in-progress: false

jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Protect initialized repository
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package.json || -d ios || -d android ]]; then
            echo 'Repository is already initialized.'
            exit 1
          fi
          test -f kepler-overlay-v0.2.zip
          unzip -t kepler-overlay-v0.2.zip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Generate official React Native 0.87 project
        shell: bash
        run: |
          set -euo pipefail
          npx --yes @react-native-community/cli@20.2.0 init IumrahApp \
            --version 0.87.0 \
            --title 'iumrah Beta' \
            --package-name com.iumrah.app.beta \
            --pm npm \
            --install-pods false \
            --skip-git-init

      - name: Move generated project to repository root
        shell: bash
        run: |
          set -euo pipefail
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            IumrahApp/ ./
          rm -rf IumrahApp

      - name: Apply iumrah foundation overlay
        shell: bash
        run: |
          set -euo pipefail
          unzip -o kepler-overlay-v0.2.zip -d .
          rm -f kepler-overlay-v0.2.zip

      - name: Validate generated structure
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -f package-lock.json
          test -f App.tsx
          test -d src
          test -d ios
          test -d android
          test -f ios/IumrahApp.xcodeproj/project.pbxproj
          test -f android/gradlew
          grep -q '"react-native": "0.87.0"' package.json
          grep -q 'com.iumrah.app.beta' ios/IumrahApp.xcodeproj/project.pbxproj
          grep -R -q 'com.iumrah.app.beta' android/app

      - name: Validate TypeScript and lint
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run lint
          npx tsc --noEmit

      - name: Remove one-time initializer and commit foundation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Initialize React Native 0.87 foundation'
          git push origin HEAD:${GITHUB_REF_NAME}
