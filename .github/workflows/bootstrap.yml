name: Bootstrap React Native

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: kepler-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Create React Native foundation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify repository is not already initialized
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package.json || -d ios || -d android ]]; then
            echo "React Native project already exists; refusing to overwrite it."
            exit 1
          fi

      - name: Set up Node.js 22.13
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Show toolchain
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version

      - name: Generate React Native 0.87 project
        shell: bash
        run: |
          set -euo pipefail
          npx --yes @react-native-community/cli@latest init IumrahBeta \
            --version 0.87.0 \
            --title "iumrah Beta" \
            --package-name com.iumrah.app.beta \
            --pm npm \
            --install-pods false \
            --skip-git-init

      - name: Move generated project to repository root
        shell: bash
        run: |
          set -euo pipefail
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            IumrahBeta/ ./
          rm -rf IumrahBeta

      - name: Validate generated project
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -f tsconfig.json
          test -d ios
          test -d android
          test -f ios/IumrahBeta.xcodeproj/project.pbxproj
          test -f android/gradlew
          grep -q '"react-native"' package.json
          grep -q 'com.iumrah.app.beta' ios/IumrahBeta.xcodeproj/project.pbxproj
          grep -R -q 'com.iumrah.app.beta' android/app
          npm run lint
          npx tsc --noEmit

      - name: Commit generated foundation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "Bootstrap React Native 0.87 foundation"
          git push origin HEAD:${GITHUB_REF_NAME}
