name: Initialize React Native Foundation

"on":
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: kepler-initialize
  cancel-in-progress: false

jobs:
  initialize:
    name: Generate and validate React Native 0.87 foundation
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse to overwrite an initialized native project
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package.json || -d ios || -d android ]]; then
            echo 'A native React Native project already exists. Initialization stopped to protect it.'
            exit 1
          fi

      - name: Verify overlay archive
        shell: bash
        run: |
          set -euo pipefail
          test -f kepler-overlay-v0.1.zip
          unzip -t kepler-overlay-v0.1.zip

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate official React Native project
        shell: bash
        run: |
          set -euo pipefail
          npx --yes @react-native-community/cli@20.2.0 init IumrahApp \
            --version 0.87.0 \
            --title 'iumrah Beta' \
            --package-name com.iumrah.app.beta \
            --pm npm \
            --install-pods false \
            --skip-git-init

      - name: Move generated native project into repository root
        shell: bash
        run: |
          set -euo pipefail
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            IumrahApp/ ./
          rm -rf IumrahApp

      - name: Apply iumrah overlay
        shell: bash
        run: |
          set -euo pipefail
          unzip -o kepler-overlay-v0.1.zip -d .
          rm -f kepler-overlay-v0.1.zip

      - name: Validate identifiers and generated structure
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -f package-lock.json
          test -f App.tsx
          test -d src
          test -d ios
          test -d android
          test -f ios/IumrahApp.xcodeproj/project.pbxproj
          test -f android/gradlew
          grep -q '"react-native": "0.87.0"' package.json
          grep -q 'com.iumrah.app.beta' ios/IumrahApp.xcodeproj/project.pbxproj
          grep -R -q 'com.iumrah.app.beta' android/app
          grep -R -q 'IumrahApp' android/app/src/main

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-37' \
            'build-tools;37.0.0' \
            'ndk;27.1.12297006'

      - name: Build Android debug as pre-release validation
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Commit validated foundation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'Initialize React Native 0.87 client foundation'
          git push origin HEAD:${GITHUB_REF_NAME}
