name: Cleanup iumrah Beta repository garbage

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove generated Beta garbage from repository root
        shell: bash
        run: |
          set -euo pipefail

          echo "Files scheduled for cleanup:"
          find . -maxdepth 1 -type f \(
            -name 'iumrah-beta-update-*.zip' -o
            -name 'BETA_*.txt'
          \) -print | sort || true

          find . -maxdepth 1 -type f \(
            -name 'iumrah-beta-update-*.zip' -o
            -name 'BETA_*.txt'
          \) -delete

          echo "Cleanup completed."

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "iumrah-ci"
          git config user.email "actions@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No matching garbage files found. Nothing to commit."
            exit 0
          fi

          git commit -m "Clean Beta repository artifacts [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
